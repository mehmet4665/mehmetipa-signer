name: Build Mehmet IPA iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate app icons
        run: |
          mkdir -p /tmp/mehmet-assets
          cp assets/icon.PNG /tmp/mehmet-assets/icon.png
          npx @capacitor/assets generate --ios --assetPath /tmp/mehmet-assets --verbose

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Mehmet-IPA-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mehmet-IPA-iOS
          path: Mehmet-IPA-iOS.ipa

      - name: Publish IPA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mehmet IPA Latest
          files: Mehmet-IPA-iOS.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
