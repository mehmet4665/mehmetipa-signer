name: Build Mehmet IPA iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate app icons
        run: |
          cp assets/icon.PNG assets/logo.png
          npx @capacitor/assets generate --ios

      - name: Show Apple toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Prepare Swift Package Manager
        run: |
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$RUNNER_TEMP/SwiftPackageCache"
          rm -rf "$RUNNER_TEMP/SourcePackages"

      - name: Resolve Swift packages (retry transient download errors)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "Swift package resolution attempt $attempt/5"
            xcodebuild \
              -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -packageCachePath "$RUNNER_TEMP/SwiftPackageCache" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
            result=$?

            if [ "$result" -eq 0 ]; then
              echo "Swift packages resolved successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Package download failed (exit $result). Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Swift package resolution failed after 5 attempts."
          exit 1

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -packageCachePath "$RUNNER_TEMP/SwiftPackageCache" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Mehmet-IPA-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mehmet-IPA-iOS
          path: Mehmet-IPA-iOS.ipa

      - name: Publish IPA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mehmet IPA Latest
          files: Mehmet-IPA-iOS.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
